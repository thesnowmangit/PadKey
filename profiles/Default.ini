; PadKey profile - edited from within the app
;
; The pad has two connection modes and they are NOT interchangeable:
;   VID 20BC - normal mode. Shows up as an Xbox 360 controller, byte 10 of the vendor
;              stream carries the paddles: 0x08 idle, 0x09 right, 0x0A left.
;   VID 20DD - charging / alternate mode. No gamepad interface at all, and byte 10 means
;              something else entirely (values like 0x02 and 0xA9 were observed there).
; So the vid IS pinned on purpose. Matching both modes made the keys fire on their own.
;
; arm_ms: the signal must hold across two stream frames before firing. Measured on this
; pad, every false trigger lasted a single frame and every real press lasted 48 ms or more.

[Back button 1 - left]
enabled = 1
vid = 0x20BC
pid = 0x5127
usagepage = 0xFF
usage = 0x03
byte = 10
mask = 0x02
value = 0x02
devlabel = 20BC:5127 MI_01
key = F12
mode = tap
hold_ms = 45
cooldown_ms = 250
debounce_ms = 130
arm_ms = 35

[Back button 2 - right]
enabled = 1
vid = 0x20BC
pid = 0x5127
usagepage = 0xFF
usage = 0x03
byte = 10
mask = 0x01
value = 0x01
devlabel = 20BC:5127 MI_01
key = F5
mode = tap
hold_ms = 45
cooldown_ms = 250
debounce_ms = 130
arm_ms = 35
